name: IETF Internet-Draft

on:
  push:
    paths:
      - "ietf/**"
      - "spec/agent-registry-protocol-protocol-precision-pp01.md"
      - "spec/agent-registry-protocol-authority-commitment-pp02.md"
      - "spec/agent-registry-protocol-wire-contract-pp03.md"
      - "spec/agent-registry-protocol-v0.10.0.md"
      - "spec/agent-registry-protocol-protocol-interoperability-pp04.md"
      - "conformance/test-vectors/protocol-interoperability-pp04.json"
      - "spec/agent-registry-protocol-protocol-interoperability-pp04.md"
      - "conformance/test-vectors/protocol-interoperability-pp04.json"
      - "registries/wire-contract-requirements-pp03.json"
      - "conformance/test-vectors/wire-contract/**"
      - "scripts/validate_wire_contract_pp03.py"
      - "registries/authority-commitment-requirements-pp02.json"
      - "conformance/test-vectors/authority-at-commitment/**"
      - "registries/protocol-precision-requirements-pp01.json"
      - "conformance/test-vectors/protocol-precision/**"
      - "scripts/build_ietf_draft.sh"
      - "scripts/validate_ietf_draft.py"
      - "scripts/validate_protocol_precision.py"
      - "scripts/validate_authority_commitment_pp02.py"
      - "Makefile"
      - ".github/workflows/ietf-draft.yml"
  pull_request:
    paths:
      - "ietf/**"
      - "spec/agent-registry-protocol-protocol-precision-pp01.md"
      - "spec/agent-registry-protocol-authority-commitment-pp02.md"
      - "spec/agent-registry-protocol-wire-contract-pp03.md"
      - "spec/agent-registry-protocol-v0.10.0.md"
      - "registries/wire-contract-requirements-pp03.json"
      - "conformance/test-vectors/wire-contract/**"
      - "scripts/validate_wire_contract_pp03.py"
      - "registries/authority-commitment-requirements-pp02.json"
      - "conformance/test-vectors/authority-at-commitment/**"
      - "registries/protocol-precision-requirements-pp01.json"
      - "conformance/test-vectors/protocol-precision/**"
      - "scripts/build_ietf_draft.sh"
      - "scripts/validate_ietf_draft.py"
      - "scripts/validate_protocol_precision.py"
      - "scripts/validate_authority_commitment_pp02.py"
      - "Makefile"
      - ".github/workflows/ietf-draft.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ietf/requirements.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install IETF authoring dependencies
        run: make ietf-setup
      - name: Build and validate Internet-Draft revision -04
        run: make ietf-check
      - name: Upload rendered Internet-Draft revision -04
        uses: actions/upload-artifact@v7
        with:
          name: draft-sankarshan-agent-registry-protocol-04
          path: |
            ietf/generated/draft-sankarshan-agent-registry-protocol-04.xml
            ietf/generated/draft-sankarshan-agent-registry-protocol-04.txt
            ietf/generated/draft-sankarshan-agent-registry-protocol-04.html
